<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Grill App v1.04</title>

<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    font-family: -apple-system;
    background: #111;
    color: white;
    text-align: center;
}

.version { font-size:12px; opacity:0.6; }

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

button {
    padding:16px;
    font-size:18px;
    border-radius:12px;
    border:none;
    margin-top:10px;
}

.primary { background:#ff7a00; }
.secondary { background:#333; color:white; }

/* 👉 KACHELN */
#grill {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card {
    background:#1f1f1f;
    margin:10px;
    padding:15px;
    border-radius:16px;
    width:160px;
}

/* Timer */
.timer { font-size:26px; }

/* Kreis */
.circleWrapper {
    position:relative;
    width:100px;
    margin:10px auto;
}

.choice {
    background:#2a2a2a;
    padding:15px;
    margin:10px;
    border-radius:10px;
}

/* Alarm */
#alarmOverlay {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:black;
    display:none;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:28px;
    z-index:9999;
}
</style>
</head>

<body>

<h1>🔥 Grill App</h1>
<div class="version">Version 1.04</div>

<div class="grid">
    <button class="primary" onclick="startDish(addBurger)">🍔 Burger</button>
    <button class="primary" onclick="startDish(addSteak)">🥩 Steak</button>
    <button class="primary" onclick="startDish(addBratwurst)">🌭 Bratwurst</button>
</div>

<button class="secondary" onclick="testSound()">🔊 Sound testen</button>

<div id="selection"></div>
<div id="grill"></div>

<div id="alarmOverlay">
    <div id="alarmText">⏰</div>
    <button onclick="closeAlarm()">Weiter</button>
</div>

<script>

// 🔊 Sound 3x
function playSoundTriple(){
    for(let i=0;i<3;i++){
        setTimeout(()=>{
            new Audio("beep.mp3").play();
        }, i*600);
    }
}

// 📳 Vibration
function vibrateStrong(){
    if(navigator.vibrate){
        navigator.vibrate([300,100,300,100,500]);
    }
}

function alertUser(){
    playSoundTriple();
    vibrateStrong();
}

// Start trigger
function startDish(fn){
    alertUser();
    fn();
}

// Action Text
function getActionText(text){
    if(text.includes("wenden")) return "🔄 Jetzt wenden!";
    if(text.includes("drehen")) return "↪️ Jetzt drehen!";
    if(text.includes("Buns")) return "🍞 Buns rösten!";
    if(text.includes("indirekt")) return "🌡️ Indirekt weiter garen!";
    if(text.includes("direkt")) return "🔥 Direkt weiter grillen!";
    if(text.includes("Vorheizen")) return "🔥 Grill vorheizen!";
    return "⏰ Nächster Schritt!";
}

// Alarm
let nextStep;

function showAlarm(text){
    document.getElementById("alarmText").innerText=text;
    document.getElementById("alarmOverlay").style.display="flex";
    alertUser();
}

function closeAlarm(){
    document.getElementById("alarmOverlay").style.display="none";
    nextStep();
}

// 🍔 BURGER
function addBurger(){
    createCard("🍔 Burger",[
        {text:"🔥 Vorheizen 240°C",time:0},
        {text:"🥩 2:15 direkt 🔥 dann drehen",time:135},
        {text:"🔄 2:15 direkt 🔥 dann wenden",time:135},
        {text:"🥩 1:30 direkt 🔥 dann drehen",time:90},
        {text:"🌡️ indirekt + Buns",time:180}
    ]);
}

// 🌭 BRATWURST
function addBratwurst(){
    createCard("🌭 Bratwurst",[
        {text:"🔥 Vorheizen 140–150°C",time:0},
        {text:"🌡️ 5:00 indirekt",time:300},
        {text:"🌭 4:00 direkt 🔥 dann wenden",time:240},
        {text:"🌭 4:00 fertig grillen (goldbraun)",time:240}
    ]);
}

// 🥩 STEAK
function addSteak(){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🥩 Fleisch wählen</h2>";

    s.appendChild(choice("🐄 Rind",()=>chooseLevel("r")));
    s.appendChild(choice("🐖 Schwein",()=>chooseLevel("s")));
}

function chooseLevel(type){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🔥 Garstufe</h2>";

    s.appendChild(choice("🔴 Englisch",()=>startSteak(type,"e")));
    s.appendChild(choice("🟠 Medium",()=>startSteak(type,"m")));
    s.appendChild(choice("⚫ Durch",()=>startSteak(type,"d")));
}

function startSteak(type,level){
    document.getElementById("selection").innerHTML="";

    let steps;

    if(type==="r"){
        if(level==="e"){
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 1:30 direkt 🔥 dann wenden",time:90},
                {text:"🥩 1:30 fertig (roh)",time:90}
            ];
        } else if(level==="m"){
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 2:00 direkt 🔥 dann wenden",time:120},
                {text:"🥩 2:00 direkt",time:120},
                {text:"🌡️ 3:00 indirekt",time:180}
            ];
        } else {
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 2:30 direkt 🔥 dann wenden",time:150},
                {text:"🥩 2:30 direkt",time:150},
                {text:"🌡️ 5:00 indirekt",time:300}
            ];
        }
    } else {
        steps=[
            {text:"🔥 200–220°C",time:0},
            {text:"🥩 3:00 direkt 🔥 dann wenden",time:180},
            {text:"🥩 3:00 direkt",time:180},
            {text:"🌡️ 4–5:00 indirekt (saftig & durch)",time:300}
        ];
    }

    createCard("🥩 Steak",steps);
}

// UI
function choice(txt,fn){
    let d=document.createElement("div");
    d.className="choice";
    d.innerText=txt;
    d.onclick=fn;
    return d;
}

// CARD (jede Kachel!)
function createCard(title,steps){
    let current=0,timeLeft=0,total=0,interval;

    let icon="🍔";
    if(title.includes("Bratwurst")) icon="🌭";
    if(title.includes("Steak")) icon="🥩";

    const card=document.createElement("div");
    card.className="card";

    const titleEl=document.createElement("div");
    titleEl.innerText=title;

    const timer=document.createElement("div");
    timer.className="timer";

    const instr=document.createElement("div");

    const wrapper=document.createElement("div");
    wrapper.className="circleWrapper";

    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width","100");
    svg.setAttribute("height","100");

    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx","50");
    circle.setAttribute("cy","50");
    circle.setAttribute("r","40");
    circle.setAttribute("stroke","#ff7a00");
    circle.setAttribute("stroke-width","8");
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke-dasharray","251");
    circle.setAttribute("transform","rotate(-90 50 50)");

    const iconEl=document.createElement("div");
    iconEl.innerText=icon;
    iconEl.style.position="absolute";
    iconEl.style.top="50%";
    iconEl.style.left="50%";
    iconEl.style.transform="translate(-50%,-50%)";

    svg.appendChild(circle);
    wrapper.append(svg,iconEl);

    card.append(titleEl,timer,wrapper,instr);
    document.getElementById("grill").appendChild(card);

    function run(){
        let step=steps[current];
        instr.innerText=step.text;

        total=step.time;
        timeLeft=step.time;

        if(step.time>0){
            interval=setInterval(()=>{
                timeLeft--;

                timer.innerText=`${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,"0")}`;

                let offset=251*(1-timeLeft/total);
                circle.setAttribute("stroke-dashoffset",offset);

                if(timeLeft<=0){
                    clearInterval(interval);
                    nextStep=next;
                    showAlarm(getActionText(step.text)+"\n\n"+step.text);
                }
            },1000);
        }
    }

    function next(){
        current++;
        if(current>=steps.length){
            instr.innerText="🔥 Fertig!";
            return;
        }
        run();
    }

    run();
}

function testSound(){ alertUser(); }

</script>

</body>
</html>
