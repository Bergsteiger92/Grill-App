<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Grill App v1.02</title>

<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    font-family: -apple-system;
    background: #111;
    color: white;
    text-align: center;
}

h1 { margin-top: 20px; }

.version {
    font-size: 12px;
    opacity: 0.6;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

button {
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    margin-top: 10px;
}

.primary { background:#ff7a00; }
.secondary { background:#333; color:white; }

.card {
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
}

.timer {
    font-size: 40px;
}

.instruction {
    font-size: 20px;
    margin: 15px 0;
}

.circleWrapper {
    position:relative;
    width:120px;
    margin:20px auto;
}

.choice {
    background:#2a2a2a;
    padding:15px;
    margin:10px;
    border-radius:10px;
}

#alarmOverlay {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:black;
    display:none;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:30px;
    z-index:9999;
}
</style>
</head>

<body>

<h1>🔥 Grill App</h1>
<div class="version">Version 1.02</div>

<div class="grid">
    <button class="primary" onclick="addBurger()">🍔 Burger</button>
    <button class="primary" onclick="addSteak()">🥩 Steak</button>
    <button class="primary" onclick="addBratwurst()">🌭 Bratwurst</button>
</div>

<button class="secondary" onclick="testSound()">🔊 Sound testen</button>

<div id="selection"></div>
<div id="grill"></div>

<div id="alarmOverlay">
    <div id="alarmText">⏰</div>
    <button onclick="closeAlarm()">Weiter</button>
</div>

<script>
// SOUND
function playSound(){
    new Audio("beep.mp3").play();
}
function vibrate(){
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

// ACTION TEXT
function getActionText(text){
    if(text.includes("wenden")) return "🔄 Jetzt wenden!";
    if(text.includes("drehen")) return "↪️ Jetzt drehen!";
    if(text.includes("Buns")) return "🍞 Buns rösten!";
    if(text.includes("indirekt")) return "🌡️ Indirekt weiter garen!";
    if(text.includes("direkt")) return "🔥 Direkt weiter grillen!";
    if(text.includes("Vorheizen")) return "🔥 Grill vorheizen!";
    return "⏰ Nächster Schritt!";
}

// ALARM
let nextStep;
function showAlarm(text){
    document.getElementById("alarmText").innerText=text;
    document.getElementById("alarmOverlay").style.display="flex";
    playSound();
    vibrate();
}
function closeAlarm(){
    document.getElementById("alarmOverlay").style.display="none";
    nextStep();
}

// BURGER
function addBurger(){
    createCard("🍔 Burger",[
        {text:"🔥 Vorheizen 240°C",time:0},
        {text:"🥩 2:15 direkt grillen 🔥 dann drehen",time:135},
        {text:"🔄 2:15 direkt grillen 🔥 dann wenden",time:135},
        {text:"🥩 1:30 direkt grillen 🔥 dann drehen",time:90},
        {text:"🌡️ indirekt + Buns",time:180}
    ]);
}

// BRATWURST
function addBratwurst(){
    createCard("🌭 Bratwurst",[
        {text:"🔥 Vorheizen 140–150°C",time:0},
        {text:"🌡️ 5:00 indirekt",time:300},
        {text:"🔥 hochheizen",time:0},
        {text:"🌭 4:00 direkt 🔥 dann wenden",time:240}
    ]);
}

// STEAK AUSWAHL
function addSteak(){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🥩 Fleisch wählen</h2>";

    s.appendChild(choice("🐄 Rind",()=>chooseLevel("r")));
    s.appendChild(choice("🐖 Schwein",()=>chooseLevel("s")));
}

function chooseLevel(type){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🔥 Garstufe wählen</h2>";

    s.appendChild(choice("🔴 Englisch",()=>startSteak(type,"e")));
    s.appendChild(choice("🟠 Medium",()=>startSteak(type,"m")));
    s.appendChild(choice("⚫ Durch",()=>startSteak(type,"d")));
}

function startSteak(type,level){
    document.getElementById("selection").innerHTML="";

    let steps;

    if(type==="r"){
        if(level==="e"){
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 1:30 direkt 🔥 dann wenden",time:90},
                {text:"🥩 1:30 fertig (roh)",time:90}
            ];
        } else if(level==="m"){
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 2:00 direkt 🔥 dann wenden",time:120},
                {text:"🥩 2:00 direkt grillen",time:120},
                {text:"🌡️ 3:00 indirekt",time:180}
            ];
        } else {
            steps=[
                {text:"🔥 250°C+",time:0},
                {text:"🥩 2:30 direkt 🔥 dann wenden",time:150},
                {text:"🥩 2:30 direkt grillen",time:150},
                {text:"🌡️ 5:00 indirekt fertig garen",time:300}
            ];
        }
    } else {
        steps=[
            {text:"🔥 200–220°C",time:0},
            {text:"🥩 3:00 direkt 🔥 dann wenden",time:180},
            {text:"🥩 3:00 direkt grillen",time:180},
            {text:"🌡️ 5:00 indirekt vollständig durch",time:300}
        ];
    }

    createCard("🥩 Steak",steps);
}

// UI
function choice(txt,fn){
    let d=document.createElement("div");
    d.className="choice";
    d.innerText=txt;
    d.onclick=fn;
    return d;
}

// CARD
function createCard(title,steps){
    let current=0,timeLeft=0,total=0,interval;

    let dishIcon="⏱️";
    if(title.includes("Burger")) dishIcon="🍔";
    if(title.includes("Bratwurst")) dishIcon="🌭";
    if(title.includes("Steak")) dishIcon="🥩";

    const card=document.createElement("div");
    card.className="card";

    const h=document.createElement("h2");
    h.innerText=title;

    const timer=document.createElement("div");
    timer.className="timer";

    const instr=document.createElement("div");
    instr.className="instruction";

    const btn=document.createElement("button");
    btn.innerText="Weiter";

    const wrapper=document.createElement("div");
    wrapper.className="circleWrapper";

    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width","120");
    svg.setAttribute("height","120");

    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx","60");
    circle.setAttribute("cy","60");
    circle.setAttribute("r","50");
    circle.setAttribute("stroke","#ff7a00");
    circle.setAttribute("stroke-width","10");
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke-dasharray","314");
    circle.setAttribute("transform","rotate(-90 60 60)");

    svg.appendChild(circle);

    const icon=document.createElement("div");
    icon.innerText=dishIcon;
    icon.style.position="absolute";
    icon.style.top="50%";
    icon.style.left="50%";
    icon.style.transform="translate(-50%,-50%)";
    icon.style.fontSize="30px";

    wrapper.appendChild(svg);
    wrapper.appendChild(icon);

    card.append(h,timer,wrapper,instr,btn);
    document.getElementById("grill").appendChild(card);

    function run(){
        let step=steps[current];
        instr.innerText=step.text;

        total=step.time;
        timeLeft=step.time;

        if(step.time>0){
            interval=setInterval(()=>{
                timeLeft--;

                let m=Math.floor(timeLeft/60);
                let s=timeLeft%60;
                timer.innerText=`${m}:${s.toString().padStart(2,"0")}`;

                let offset=314*(1-timeLeft/total);
                circle.setAttribute("stroke-dashoffset",offset);

                if(timeLeft<=0){
                    clearInterval(interval);
                    nextStep=next;

                    const action=getActionText(step.text);
                    showAlarm(action+"\n\n"+step.text);
                }
            },1000);
        }
    }

    function next(){
        current++;
        if(current>=steps.length){
            instr.innerText="🔥 Fertig!";
            return;
        }
        run();
    }

    btn.onclick=next;
    run();
}

function testSound(){ playSound(); }

</script>

</body>
</html>
