<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Grill App v1.05</title>

<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    font-family: -apple-system;
    background: #111;
    color: white;
    text-align: center;
}

.version { font-size:12px; opacity:0.6; }

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
}

button {
    padding:14px;
    font-size:16px;
    border-radius:10px;
    border:none;
}

.primary { background:#ff7a00; }
.secondary { background:#333; color:white; }

/* 🔥 breite Kachel */
.card {
    background:#1f1f1f;
    margin:10px;
    padding:15px;
    border-radius:16px;
    width:90%;
    max-width:400px;
    margin-left:auto;
    margin-right:auto;
}

/* obere Zeile */
.row {
    display:flex;
    align-items:center;
    justify-content:space-between;
}

/* Kreis */
.circleWrapper {
    position:relative;
    width:80px;
}

/* Button rechts */
.nextBtn {
    background:#2ecc71;
    padding:12px;
    font-size:14px;
}

/* Text */
.instruction {
    margin-top:10px;
    font-size:18px;
}
</style>
</head>

<body>

<h1>🔥 Grill App</h1>
<div class="version">Version 1.05</div>

<div class="grid">
    <button class="primary" onclick="startDish(addBurger)">🍔 Burger</button>
    <button class="primary" onclick="startDish(addSteak)">🥩 Steak</button>
    <button class="primary" onclick="startDish(addBratwurst)">🌭 Bratwurst</button>
</div>

<button class="secondary" onclick="testSound()">🔊 Sound testen</button>

<div id="selection"></div>
<div id="grill"></div>

<div id="alarmOverlay" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:black;color:white;align-items:center;justify-content:center;flex-direction:column;">
    <div id="alarmText"></div>
    <button onclick="closeAlarm()">Weiter</button>
</div>

<script>

// 🔊 Sound 3x
function playSoundTriple(){
    for(let i=0;i<3;i++){
        setTimeout(()=>new Audio("beep.mp3").play(), i*600);
    }
}

// 📳 Vibration
function vibrateStrong(){
    if(navigator.vibrate){
        navigator.vibrate([300,100,300,100,500]);
    }
}

function alertUser(){
    playSoundTriple();
    vibrateStrong();
}

function startDish(fn){
    alertUser();
    fn();
}

// Action Text
function getActionText(text){
    if(text.includes("wenden")) return "🔄 Jetzt wenden!";
    if(text.includes("drehen")) return "↪️ Jetzt drehen!";
    if(text.includes("indirekt")) return "🌡️ Indirekt weiter garen!";
    return "⏰ Weiter!";
}

// Alarm
let nextStep;
function showAlarm(text){
    document.getElementById("alarmText").innerText=text;
    document.getElementById("alarmOverlay").style.display="flex";
    alertUser();
}
function closeAlarm(){
    document.getElementById("alarmOverlay").style.display="none";
    nextStep();
}

// 🍔
function addBurger(){
    createCard("🍔 Burger",[
        {text:"🔥 Vorheizen 240°C",time:0},
        {text:"🥩 2:15 direkt 🔥 dann drehen",time:135},
        {text:"🔄 2:15 direkt 🔥 dann wenden",time:135},
        {text:"🥩 1:30 direkt 🔥 dann drehen",time:90},
        {text:"🌡️ indirekt + Buns",time:180}
    ]);
}

// 🌭
function addBratwurst(){
    createCard("🌭 Bratwurst",[
        {text:"🔥 Vorheizen 140–150°C",time:0},
        {text:"🌡️ 5:00 indirekt",time:300},
        {text:"🌭 4:00 direkt 🔥 dann wenden",time:240},
        {text:"🌭 4:00 fertig",time:240}
    ]);
}

// 🥩
function addSteak(){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🥩 Fleisch wählen</h2>";

    s.appendChild(choice("🐄 Rind",()=>chooseLevel()));
    s.appendChild(choice("🐖 Schwein",()=>startSteak("s")));
}

function chooseLevel(){
    let s=document.getElementById("selection");
    s.innerHTML="<h2>🔥 Garstufe wählen</h2>";

    s.appendChild(choice("🔴 Englisch",()=>startSteak("r","e")));
    s.appendChild(choice("🟠 Medium",()=>startSteak("r","m")));
    s.appendChild(choice("⚫ Durch",()=>startSteak("r","d")));
}

function startSteak(type,level){
    document.getElementById("selection").innerHTML="";

    let steps;

    if(type==="s"){
        steps=[
            {text:"🔥 200–220°C",time:0},
            {text:"🥩 3:00 direkt 🔥 dann wenden",time:180},
            {text:"🥩 3:00 direkt",time:180},
            {text:"🌡️ 5:00 indirekt (saftig & durch)",time:300}
        ];
    } else {
        steps=[
            {text:"🔥 250°C+",time:0},
            {text:"🥩 2:00 direkt 🔥 dann wenden",time:120},
            {text:"🌡️ indirekt",time:180}
        ];
    }

    createCard("🥩 Steak",steps);
}

// UI
function choice(txt,fn){
    let d=document.createElement("div");
    d.className="choice";
    d.innerText=txt;
    d.onclick=fn;
    return d;
}

// 🔥 CARD
function createCard(title,steps){

    let current=0,timeLeft=0,total=0,interval;

    let icon="🍔";
    if(title.includes("Bratwurst")) icon="🌭";
    if(title.includes("Steak")) icon="🥩";

    const card=document.createElement("div");
    card.className="card";

    const row=document.createElement("div");
    row.className="row";

    const wrapper=document.createElement("div");
    wrapper.className="circleWrapper";

    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width","80");
    svg.setAttribute("height","80");

    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx","40");
    circle.setAttribute("cy","40");
    circle.setAttribute("r","35");
    circle.setAttribute("stroke","#ff7a00");
    circle.setAttribute("stroke-width","6");
    circle.setAttribute("fill","none");
    circle.setAttribute("stroke-dasharray","220");
    circle.setAttribute("transform","rotate(-90 40 40)");

    const iconEl=document.createElement("div");
    iconEl.innerText=icon;
    iconEl.style.position="absolute";
    iconEl.style.top="50%";
    iconEl.style.left="50%";
    iconEl.style.transform="translate(-50%,-50%)";

    svg.appendChild(circle);
    wrapper.append(svg,iconEl);

    const btn=document.createElement("button");
    btn.className="nextBtn";
    btn.innerText="Weiter";

    row.append(wrapper,btn);

    const instr=document.createElement("div");
    instr.className="instruction";

    card.append(row,instr);
    document.getElementById("grill").appendChild(card);

    function run(){
        let step=steps[current];
        instr.innerText=step.text;

        total=step.time;
        timeLeft=step.time;

        if(step.time>0){
            interval=setInterval(()=>{
                timeLeft--;

                let offset=220*(1-timeLeft/total);
                circle.setAttribute("stroke-dashoffset",offset);

                if(timeLeft<=0){
                    clearInterval(interval);
                    nextStep=next;
                    showAlarm(getActionText(step.text));
                }
            },1000);
        }
    }

    function next(){
        current++;
        if(current>=steps.length){
            instr.innerText="🔥 Fertig!";
            return;
        }
        run();
    }

    btn.onclick=next;

    run();
}

function testSound(){ alertUser(); }

</script>

</body>
</html>
