<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Grill App v1.0</title>

<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
body {
    font-family: -apple-system;
    background: #111;
    color: white;
    text-align: center;
}

h1 { margin-top: 20px; }

.version {
    font-size: 12px;
    opacity: 0.6;
}

/* Layout */
.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 10px;
}

button {
    padding: 16px;
    font-size: 18px;
    border-radius: 12px;
    border: none;
    margin-top: 10px;
}

.primary { background:#ff7a00; }
.secondary { background:#333; color:white; }

/* Karten */
.card {
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
}

.card.direct { background:#ff3b30; }
.card.indirect { background:#007aff; }
.card.neutral { background:#1f1f1f; }

.timer {
    font-size: 40px;
}

.instruction {
    font-size: 20px;
    margin: 15px 0;
}

/* Kreis */
.circle {
    width: 120px;
    margin: 20px auto;
}

/* Auswahl */
.choice {
    background:#2a2a2a;
    padding:15px;
    margin:10px;
    border-radius:10px;
}

/* Alarm */
#alarmOverlay {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:black;
    display:none;
    color:white;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    font-size:30px;
    z-index:9999;
}
</style>
</head>

<body>

<h1>🔥 Grill App</h1>
<div class="version">Version 1.0</div>

<div class="grid">
    <button class="primary" onclick="addBurger()">🍔 Burger</button>
    <button class="primary" onclick="addSteak()">🥩 Steak</button>
    <button class="primary" onclick="addBratwurst()">🌭 Bratwurst</button>
</div>

<button class="secondary" onclick="testSound()">🔊 Sound testen</button>

<div id="selection"></div>
<div id="grill"></div>

<!-- Alarm -->
<div id="alarmOverlay">
    <div id="alarmText">⏰</div>
    <button onclick="closeAlarm()">Weiter</button>
</div>

<script>
// Sound
function playSound(){
    new Audio("beep.mp3").play();
}

function vibrate(){
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

// Alarm
let nextStep;

function showAlarm(text){
    document.getElementById("alarmText").innerText = text;
    document.getElementById("alarmOverlay").style.display="flex";
    playSound(); vibrate();
}

function closeAlarm(){
    document.getElementById("alarmOverlay").style.display="none";
    nextStep();
}

// Burger
function addBurger(){
    createCard("🍔 Burger",[
        {text:"🔥 Vorheizen 240°C",time:0},
        {text:"🥩 2:15 direkt grillen",time:135},
        {text:"🔄 wenden + 2:15",time:135},
        {text:"🥩 1:30 direkt grillen",time:90},
        {text:"🌡️ indirekt + Buns",time:180}
    ]);
}

// Wurst
function addBratwurst(){
    createCard("🌭 Bratwurst",[
        {text:"🔥 140–150°C",time:0},
        {text:"🌡️ 5:00 indirekt",time:300},
        {text:"🔥 hochheizen",time:0},
        {text:"🌭 4:00 direkt",time:240}
    ]);
}

// Steak
function addSteak(){
    let s=document.getElementById("selection");
    s.innerHTML="";
    s.appendChild(choice("🐄 Rind",()=>startSteak()));
}

function startSteak(){
    document.getElementById("selection").innerHTML="";
    createCard("🥩 Steak",[
        {text:"🔥 250°C+",time:0},
        {text:"🥩 2:00 direkt",time:120},
        {text:"🌡️ 3:00 indirekt",time:180}
    ]);
}

// Auswahl
function choice(txt,fn){
    let d=document.createElement("div");
    d.className="choice";
    d.innerText=txt;
    d.onclick=fn;
    return d;
}

// CARD
function createCard(title,steps){
    let current=0,timeLeft=0,total=0,interval;

    const card=document.createElement("div");
    card.className="card";

    const h=document.createElement("h2");
    h.innerText=title;

    const timer=document.createElement("div");
    timer.className="timer";

    const instr=document.createElement("div");

    const btn=document.createElement("button");
    btn.innerText="Weiter";

    // Kreis
    const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("width","120");
    svg.setAttribute("height","120");

    const progress=document.createElementNS("http://www.w3.org/2000/svg","circle");
    progress.setAttribute("cx","60");
    progress.setAttribute("cy","60");
    progress.setAttribute("r","50");
    progress.setAttribute("stroke","#ff7a00");
    progress.setAttribute("stroke-width","10");
    progress.setAttribute("fill","none");
    progress.setAttribute("stroke-dasharray","314");

    svg.appendChild(progress);

    card.append(h,timer,svg,instr,btn);
    document.getElementById("grill").appendChild(card);

    function run(){
        let step=steps[current];
        instr.innerText=step.text;

        total=step.time;
        timeLeft=step.time;

        if(step.time>0){
            interval=setInterval(()=>{
                timeLeft--;

                let m=Math.floor(timeLeft/60);
                let s=timeLeft%60;
                timer.innerText=`${m}:${s.toString().padStart(2,"0")}`;

                let offset=314*(1-timeLeft/total);
                progress.setAttribute("stroke-dashoffset",offset);

                if(timeLeft<=0){
                    clearInterval(interval);
                    nextStep=next;
                    showAlarm("⏰ Schritt fertig!");
                }
            },1000);
        }
    }

    function next(){
        current++;
        if(current>=steps.length){
            instr.innerText="🔥 Fertig!";
            return;
        }
        run();
    }

    btn.onclick=next;
    run();
}

// Test
function testSound(){ playSound(); }
</script>

</body>
</html>
