<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🔥 Grill App</title>

<!-- ICON -->
<link rel="apple-touch-icon" href="icon.png">

<!-- iPhone App Modus -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body {
    font-family: -apple-system, Arial;
    background: #111;
    color: white;
    text-align: center;
    margin: 0;
}

h1 { padding: 20px; }

.container { padding: 15px; }

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

button {
    padding: 16px;
    font-size: 18px;
    border-radius: 14px;
    border: none;
}

.container button {
    margin-top: 15px;
}

.primary { background: #ff7a00; color: white; }
.secondary { background: #333; color: white; }

.card {
    margin: 15px;
    padding: 20px;
    border-radius: 20px;
}

.card.direct { background: #ff3b30; }
.card.indirect { background: #007aff; }
.card.neutral { background: #1f1f1f; }

.timer {
    font-size: 48px;
    font-weight: bold;
}

.instruction {
    font-size: 20px;
    margin: 15px 0;
}

.choice {
    background: #2a2a2a;
    padding: 18px;
    margin: 10px;
    border-radius: 14px;
    font-size: 20px;
}
</style>
</head>

<body>

<h1>🔥 Grill App</h1>

<div class="container">
    <div class="grid">
        <button class="primary" onclick="addBurger()">🍔 Burger</button>
        <button class="primary" onclick="addSteak()">🥩 Steak</button>
        <button class="primary" onclick="addBratwurst()">🌭 Bratwurst</button>
    </div>

    <button class="secondary" onclick="testSound()">🔊 Sound testen</button>
</div>

<div id="selection"></div>
<div id="grill"></div>

<script>
// 🔊 SOUND
function playSound() {
    let repeat = 0;
    const beep = () => {
        new Audio("beep.mp3").play();
        setTimeout(()=> new Audio("beep.mp3").play(), 300);
    };
    const i = setInterval(() => {
        beep();
        repeat++;
        if (repeat >= 3) clearInterval(i);
    }, 1200);
}

function testSound(){ playSound(); }

// 🍔 BURGER
function addBurger() {
    createCard("🍔 Burger", [
        { text:"🔥 Grill vorheizen auf 240°C", time:0 },
        { text:"🎛️ Hitze reduzieren auf mittlere Stufe", time:0 },

        { text:"🥩 Patties auflegen – 2:15 direkt grillen 🔥 dann drehen", time:135 },
        { text:"🔄 2:15 direkt grillen 🔥 dann wenden", time:135 },

        { text:"🥩 1:30 direkt grillen 🔥 dann drehen", time:90 },
        { text:"🔥 1:30 direkt fertig grillen", time:90 },

        { text:"🌡️ Patties in indirekte Zone legen", time:0 },
        { text:"🍞 Buns kurz anrösten", time:0 },

        { text:"🌡️ 3:00 indirekt fertig garen", time:180 }
    ]);
}

// 🌭 BRATWURST
function addBratwurst() {
    createCard("🌭 Bratwurst", [
        { text:"🔥 Grill vorheizen auf 140–150°C", time:0 },
        { text:"🌡️ 5:00 indirekt grillen (sanft garen)", time:300 },
        { text:"🔥 Grill auf 180–200°C hochheizen", time:0 },
        { text:"🌭 4:00 direkt grillen 🔥 dann wenden", time:240 },
        { text:"🌭 4:00 direkt fertig grillen", time:240 }
    ]);
}

// 🥩 STEAK
function addSteak(){
    const sel = document.getElementById("selection");
    sel.innerHTML = "<h2>🥩 Fleisch wählen</h2>";

    sel.appendChild(choice("🐄 Rind",()=>chooseSteakLevel("r")));
    sel.appendChild(choice("🐖 Schwein",()=>chooseSteakLevel("s")));
}

function chooseSteakLevel(type){
    const sel = document.getElementById("selection");
    sel.innerHTML = "<h2>🔥 Garstufe wählen</h2>";

    sel.appendChild(choice("🔴 Englisch",()=>startSteak(type,"e")));
    sel.appendChild(choice("🟠 Medium",()=>startSteak(type,"m")));
    sel.appendChild(choice("⚫ Durch",()=>startSteak(type,"d")));
}

function startSteak(type,level){
    document.getElementById("selection").innerHTML="";

    let steps;

    if(type==="r"){
        if(level==="e"){
            steps=[
                { text:"🔥 Grill stark vorheizen (250°C+)", time:0 },
                { text:"🥩 1:30 direkt angrillen 🔥 dann wenden", time:90 },
                { text:"🥩 1:30 fertig grillen (roh)", time:90 }
            ];
        }
        else if(level==="m"){
            steps=[
                { text:"🔥 Grill stark vorheizen (250°C+)", time:0 },
                { text:"🥩 2:00 direkt angrillen 🔥 dann wenden", time:120 },
                { text:"🥩 2:00 direkt grillen", time:120 },
                { text:"🌡️ 3:00 indirekt nachziehen lassen", time:180 }
            ];
        }
        else{
            steps=[
                { text:"🔥 Grill stark vorheizen (250°C+)", time:0 },
                { text:"🥩 2:30 direkt angrillen 🔥 dann wenden", time:150 },
                { text:"🥩 2:30 direkt grillen", time:150 },
                { text:"🌡️ 5:00 indirekt fertig garen", time:300 }
            ];
        }
    } else {
        steps=[
            { text:"🔥 Grill vorheizen auf 200–220°C", time:0 },
            { text:"🥩 3:00 direkt grillen 🔥 dann wenden", time:180 },
            { text:"🥩 3:00 direkt grillen", time:180 },
            { text:"🌡️ 5:00 indirekt vollständig durch garen", time:300 }
        ];
    }

    createCard("🥩 Steak", steps);
}

// Auswahl
function choice(txt,fn){
    const d=document.createElement("div");
    d.className="choice";
    d.innerText=txt;
    d.onclick=fn;
    return d;
}

// CARD SYSTEM
function createCard(title,steps){
    let current=0, timeLeft=0, interval;

    const card=document.createElement("div");
    card.className="card neutral";

    const h=document.createElement("h2");
    h.innerText=title;

    const timer=document.createElement("div");
    timer.className="timer";

    const instr=document.createElement("div");
    instr.className="instruction";

    const btn=document.createElement("button");
    btn.className="primary";
    btn.innerText="➡️ Weiter";

    card.appendChild(h);
    card.appendChild(timer);
    card.appendChild(instr);
    card.appendChild(btn);

    document.getElementById("grill").appendChild(card);

    function run(){
        const step=steps[current];
        instr.innerText=step.text;

        let mode="neutral";
        if(step.text.includes("indirekt")) mode="indirect";
        else if(step.text.includes("direkt")) mode="direct";

        card.className="card "+mode;

        if(step.time>0){
            timeLeft=step.time;
            update();

            interval=setInterval(()=>{
                timeLeft--;
                update();

                if(timeLeft<=0){
                    clearInterval(interval);
                    playSound();
                    next();
                }
            },1000);
        } else {
            timer.innerText="--:--";
        }
    }

    function update(){
        const m=Math.floor(timeLeft/60);
        const s=timeLeft%60;
        timer.innerText=
            String(m).padStart(2,"0")+":"+
            String(s).padStart(2,"0");
    }

    function next(){
        clearInterval(interval);
        current++;

        if(current>=steps.length){
            instr.innerText="🔥 Fertig!";
            timer.innerText="";
            playSound();
            setTimeout(()=>card.remove(),2000);
            return;
        }

        run();
    }

    btn.onclick=next;
    run();
}
</script>

</body>
</html>
